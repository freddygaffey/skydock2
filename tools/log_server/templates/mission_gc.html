<!doctype html>
<html><head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GC – Latest mission – Skydock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='map_shared.js') }}"></script>
  {% include "partials/sd_theme_style.html" %}
  <style>
    #map{height:min(82vh,calc(100vh - 260px));min-height:520px;border-radius:8px}
    .live-badge{display:inline-block;background:#ff4a4a;color:#fff;border-radius:12px;
                padding:2px 10px;font-size:12px;font-weight:bold;animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  </style>
</head><body>
<div class="container-fluid py-3 px-2 px-md-3" style="max-width:min(1800px,100%)">

  <div class="d-flex align-items-start justify-content-between mb-2 flex-wrap gap-2">
    <div>
      <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
        <h2 class="mb-0">GC · Latest mission ({{ mission_id }})
          <span class="badge {% if src == 'rpi' %}bg-warning text-dark{% else %}bg-secondary{% endif %} ms-1" style="font-size:0.5em;vertical-align:middle">{{ 'Real' if src == 'rpi' else 'Sim' }}</span>
        </h2>
        <span id="liveBadge" class="live-badge d-none">LIVE</span>
      </div>
      <div class="muted small">{{ log_path }}</div>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <button id="lowPowerBtn" class="btn btn-sm btn-outline-secondary" title="Reduce dashboard load">Low Power: Off</button>
      <button id="liveBtn" class="btn btn-sm btn-outline-danger">&#9679; Live</button>
      <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('log_web.missions_list', src=src) }}">← Home</a>
      <button id="themeBtn"></button>
    </div>
  </div>

  {% include "partials/mission_mode_nav.html" %}

  <div id="gcSummaryBar" class="mb-2">
    <span class="muted small">Loading…</span>
  </div>

  <div class="row g-2 mb-2 align-items-end flex-wrap">
    <div class="col-auto">
      <button id="tileToggle" class="btn btn-sm btn-outline-secondary">Satellite</button>
    </div>
    <div class="col-auto ms-2 d-flex flex-wrap gap-2 align-items-center">
      <div class="form-check form-check-inline mb-0">
        <input class="form-check-input" type="checkbox" id="layerPath" checked>
        <label class="form-check-label small" for="layerPath">Path</label>
      </div>
      <div class="form-check form-check-inline mb-0">
        <input class="form-check-input" type="checkbox" id="layerPred" checked>
        <label class="form-check-label small" for="layerPred">Predictions</label>
      </div>
      <div class="form-check form-check-inline mb-0">
        <input class="form-check-input" type="checkbox" id="layerSpray" checked>
        <label class="form-check-label small" for="layerSpray">Spray</label>
      </div>
    </div>
  </div>
  <div id="gcMapInfo" class="muted small mb-2" style="min-height:1.3em"></div>
  <div id="map"></div>
</div>

<script>
window.__SKYDOCK = {
  mid: {{ mission_id_json | safe }},
  src: {{ src_json | safe }},
  tile_osm: {{ tile_osm_url|tojson }},
  tile_esri: {{ tile_esri_url|tojson }},
};
</script>
<script src="{{ url_for('static', filename='mission_gc.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% include "partials/sd_theme_script.html" %}
</body></html>
